<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Links with Buttons</title>
    <style>
        body {
            background: linear-gradient(90deg, #ff512f 0%, #dd2476 50%, #8f5be8 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(221,36,118,0.15);
            padding: 40px 32px 32px 32px;
            max-width: 350px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #8f5be8;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            width: 100%;
        }
        .link-btn {
            background: linear-gradient(90deg, #ff512f 0%, #8f5be8 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 0;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(143,91,232,0.10);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            letter-spacing: 0.5px;
        }
        .link-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(143,91,232,0.18);
        }
        .graphics {
            margin-bottom: 40px;
        }
        .circle {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 40% 40%, #2193b0 60%, #6dd5ed 100%);
            border-radius: 50%;
            box-shadow: 0 2px 16px rgba(33,147,176,0.18);
            display: inline-block;
            margin: 0 20px;
            animation: float 2.5s ease-in-out infinite alternate;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Lottery Business Apps</h1>
        <div class="button-container">
            <button class="link-btn" onclick="window.open('https://tech-hub161.github.io/MAATARA/', '_blank')">MAA TARA AGENCY</button>
            <button class="link-btn" onclick="window.open('https://tech-hub161.github.io/ML1/', '_blank')">ML1 Business</button>
            <button class="link-btn" onclick="window.open('https://tech-hub161.github.io/RJ/', '_blank')">RJ Business</button>
        </div>
    </div>
    <!-- ...existing code... -->
</body>
</html>
